<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LojaCarro - Editar</title>
    <link rel="stylesheet" href="../bootstrap-5.3.8-dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container w-50 mb-5 mt-4">
        <h3>Editar carro</h3>
        <form id="formularioEdicao">
            <div class="mb-3">
                <label for="inputModelo" class="form-label">Modelo</label>
                <input type="text" class="form-control" id="inputModelo" maxlength="100" required>
            </div>

            <div class="mb-3">
                <label for="inputAno" class="form-label">Ano</label>
                <input type="number" class="form-control" id="inputAno" min="1886" required>
            </div>

            <div class="mb-3">
                <label for="inputPreco" class="form-label">Preço</label>
                <input type="number" class="form-control" id="inputPreco" min="0" step="0.01" required>
            </div>

            <button type="submit" class="btn btn-success">Salvar</button>
            <a href="../index.html" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
    <script src="../bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
    <script src="../auth.js"></script>
    <script src="../editar.js"></script>
</body>

</html>
