<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container w-50 mb-5 mt-4">
        <form action="index.html" method="post" class="d-flex w-100 gap-2" id="formularioCadastro">
            <input type="text" class="form-control" id="inputNome" placeholder="Nome">
            <input type="text" class="form-control" id="inputCurriculo" placeholder="Curriculo">
            <input type="number" class="form-control" id="inputSalario" placeholder="Salario">
            <button type="submit" class="btn btn-success" id="subimitButton">Adicionar</button>
        </form>
    </div>


    <div class="container w-50 justify-content-center">
        <table class="table text-center">
            <thead>
                <tr class="table-dark">
                    <th scope="col">Id</th>
                    <th scope="col">Nome</th>
                    <th scope="col">Rusumo/Curriculo</th>
                    <th scope="col">Editar/Deletar</th>
                </tr>
            </thead>
            <tbody id="funcionarios">
                
            </tbody>
        </table>
    </div>

    <div class="modal" tabindex="-1" id="modalteste">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Tem certeza que quer deletar esse funcionario?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Não</button>
                    <button type="button" class="btn btn-primary" onclick="deletarFuncionario()">Sim</button>
                </div>
            </div>
        </div>
    </div>

    <script src="bootstrap-5.3.8-dist/js/bootstrap.min.js"></script>
    <script src="index.js"></script>
</body>

</html>
